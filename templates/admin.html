<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARK ADMIN | CONTROL ROOM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #090d16; color: #fff; min-height: 100vh; padding: 25px; display: flex; flex-direction: column; align-items: center; }
        .admin-card { background: #131c2e; border: 1px solid #1e2d4a; border-radius: 20px; padding: 25px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #00ff88; font-size: 22px; margin-bottom: 15px; letter-spacing: 1px; }
        .info-box { background: #0a0f1d; border-left: 4px solid #00d4ff; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; color: #94a3b8; }
        .group-list { list-style: none; text-align: left; }
        .group-item { background: #1e293b; padding: 12px 15px; border-radius: 10px; margin-bottom: 10px; font-size: 14px; display: flex; justify-content: space-between; }
        .badge { background: #00ff88; color: #0f172a; padding: 3px 8px; border-radius: 6px; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>⚡ STARK CONTROL PANEL</h2>
    <div class="info-box">
        यह सीक्रेट पैनल केवल आपके (सूरज) लिए है। यहाँ से सभी व्हाट्सएप ग्रुप्स और API का स्टेटस कनेक्टेड है।
    </div>

    <h3 style="margin-bottom: 15px; font-size: 16px; color: #cbd5e1;">🎯 टारगेटेड व्हाट्सएप ग्रुप्स:</h3>
    <ul class="group-list">
        <li class="group-item"><span>Class 9th Group</span> <span class="badge">ACTIVE</span></li>
        <li class="group-item"><span>Class 10th Group</span> <span class="badge">ACTIVE</span></li>
        <li class="group-item"><span>Class 11th Group</span> <span class="badge">ACTIVE</span></li>
        <li class="group-item"><span>Class 12th Group</span> <span class="badge">ACTIVE</span></li>
    </ul>
</div>

</body>
</html>
