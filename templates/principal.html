<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MURARI AI | JARVIS DISPATCHER</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .beast-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            box-shadow: 0 20px 50px rgba(0, 255, 136, 0.15);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .beast-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 6px;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
        }

        .title { font-size: 26px; font-weight: 800; letter-spacing: 1px; color: #fff; margin-bottom: 8px; text-transform: uppercase; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 25px; }

        .mic-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed #475569;
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .mic-box:hover { border-color: #00ff88; background: rgba(0, 255, 136, 0.05); }
        .mic-btn { background: #ef4444; color: #fff; border: none; padding: 12px 24px; border-radius: 50px; font-weight: 600; cursor: pointer; font-size: 15px; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        textarea {
            width: 100%; height: 130px; background: #1e293b; border: 2px solid #334155;
            border-radius: 16px; color: #fff; padding: 15px; font-size: 16px; outline: none;
            resize: none; margin-bottom: 25px; transition: 0.3s;
        }
        textarea:focus { border-color: #00ff88; box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }

        .btn-broadcast {
            background: linear-gradient(90deg, #00ff88, #00b8ff);
            color: #0f172a; border: none; padding: 20px; font-size: 20px; font-weight: 800;
            border-radius: 50px; cursor: pointer; width: 100%; text-transform: uppercase;
            letter-spacing: 1px; box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3); transition: 0.2s;
        }
        .btn-broadcast:active { transform: scale(0.97); }

        .status { margin-top: 20px; font-weight: 600; font-size: 15px; min-height: 24px; }
    </style>
</head>
<body>

<div class="beast-card">
    <div class="title">⚡ MURARI AI DISPATCHER</div>
    <div class="subtitle">1-CLICK JARVIS BROADCAST SYSTEM</div>

    <div class="mic-box" onclick="startSpeech()">
        <button class="mic-btn">🎙️ बोलकर टाइप करें</button>
    </div>

    <textarea id="noticeText" placeholder="यहाँ संदेश लिखें या माइक से बोलें..."></textarea>

    <button class="btn-broadcast" onclick="sendBroadcast()" id="sendBtn">📢 BROADCAST NOW</button>

    <div class="status" id="statusMessage"></div>
</div>

<script>
    function startSpeech() {
        if ('webkitSpeechRecognition' in window) {
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.start();
            document.getElementById('statusMessage').style.color = "#00d4ff";
            document.getElementById('statusMessage').innerText = "🎙️ आपकी आवाज़ सुनी जा रही है...";
            
            recognition.onresult = function(event) {
                document.getElementById('noticeText').value = event.results[0][0].transcript;
                document.getElementById('statusMessage').style.color = "#00ff88";
                document.getElementById('statusMessage').innerText = "✅ आवाज़ टेक्स्ट में बदल गई!";
            };
        } else {
            alert("Speech recognition is not supported in this browser.");
        }
    }

    async function sendBroadcast() {
        const text = document.getElementById('noticeText').value;
        const btn = document.getElementById('sendBtn');
        const status = document.getElementById('statusMessage');

        if(!text.trim()) {
            status.style.color = "#ef4444";
            status.innerText = "❌ कृपया संदेश दर्ज करें!";
            return;
        }

        btn.disabled = true;
        btn.innerText = "SENDING... ⏳";
        status.style.color = "#00d4ff";
        status.innerText = "⚡ AI वॉइस तैयार हो रही है और ब्रॉडकास्ट हो रहा है...";

        try {
            const response = await fetch('/api/dispatch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });

            const result = await response.json();

            if(result.success) {
                status.style.color = "#00ff88";
                status.innerText = "🚀 सूचना सफलतापूर्वक सभी ग्रुप्स में पहुँच गई!";
                document.getElementById('noticeText').value = "";
            } else {
                status.style.color = "#ef4444";
                status.innerText = "❌ एरर: " + result.error;
            }
        } catch (err) {
            status.style.color = "#ef4444";
            status.innerText = "❌ नेटवर्क समस्या!";
        } finally {
            btn.disabled = false;
            btn.innerText = "📢 BROADCAST NOW";
        }
    }
</script>

</body>
  </html>
