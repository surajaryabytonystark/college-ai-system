<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURAJ COMMAND CENTER | Rocket AI Dispatcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020617;
            --glass-card: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.15);
            --apple-blue: #007AFF;
            --beast-gold: #FFD700;
            --stark-cyan: #00F2FE;
            --red-alert: #FF2E93;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        body {
            background: var(--bg-dark);
            background-image: 
                radial-gradient(at 10% 10%, rgba(0, 242, 254, 0.12) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(255, 46, 147, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Passcode Security Overlay */
        #security-lock {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(25px);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lock-card {
            background: var(--glass-card);
            border: 1px solid var(--stark-cyan);
            border-radius: 28px;
            padding: 35px;
            text-align: center;
            max-width: 360px;
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.2);
        }

        /* Main Dashboard Screen */
        .iphone-card {
            width: 100%;
            max-width: 520px;
            background: var(--glass-card);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .owner-badge {
            display: inline-block;
            background: rgba(0, 242, 254, 0.15);
            border: 1px solid var(--stark-cyan);
            color: var(--stark-cyan);
            font-size: 11px;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 100px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF 30%, var(--stark-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Rocket Speed HUD */
        .speed-hud {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .hud-item label {
            font-size: 10px;
            color: var(--text-muted);
            display: block;
        }

        .hud-item span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 700;
            color: var(--beast-gold);
        }

        .input-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input, textarea, select {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--stark-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
        }

        textarea {
            height: 90px;
            resize: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active { transform: scale(0.97); }

        .btn-ai {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid var(--beast-gold);
            color: var(--beast-gold);
            margin-bottom: 10px;
        }

        .btn-rocket {
            background: linear-gradient(135deg, var(--stark-cyan) 0%, var(--apple-blue) 100%);
            color: #000;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4);
            margin-bottom: 10px;
        }

        .btn-red-alert {
            background: linear-gradient(135deg, #FF0055 0%, #FF2E93 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 46, 147, 0.4);
        }

        .terminal-box {
            background: #000;
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px;
            margin-top: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #10B981;
            height: 80px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<!-- Stark Security Passcode Screen -->
<div id="security-lock">
    <div class="lock-card">
        <span class="owner-badge">RESTRICTED ACCESS</span>
        <h2 style="margin: 10px 0; font-size: 20px;">SURAJ OWNER KEY</h2>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">मास्टर पिन दर्ज करें (Default: 9999)</p>
        <input type="password" id="passcode" placeholder="••••" style="text-align: center; font-size: 22px; letter-spacing: 5px; margin-bottom: 15px;">
        <button class="btn btn-rocket" onclick="unlockSystem()">UNLOCK HUD</button>
    </div>
</div>

<!-- Main Command Center -->
<div class="iphone-card">
    <div class="header">
        <span class="owner-badge">STARK-BEAST AUTOMATION V4.0</span>
        <h1>SURAJ COMMAND CENTER</h1>
    </div>

    <!-- Live Rocket Speed Telemetry HUD -->
    <div class="speed-hud">
        <div class="hud-item">
            <label>SPEED</label>
            <span>1,000,000 /s</span>
        </div>
        <div class="hud-item">
            <label>TARGETS</label>
            <span id="target-count">ALL GROUPS</span>
        </div>
        <div class="hud-item">
            <label>DELIVERED</label>
            <span id="delivered-count" style="color: #10B981;">0</span>
        </div>
    </div>

    <!-- Class & Target Selector -->
    <div class="grid-2 input-group">
        <div>
            <label>🎯 टारगेट चुनें</label>
            <select id="target-select" onchange="updateTarget()">
                <option value="ALL">पूरा स्कूल (All School)</option>
                <option value="10TH">Class 10th Only</option>
                <option value="12TH">Class 12th Only</option>
                <option value="TEACHERS">Teachers Group</option>
            </select>
        </div>
        <div>
            <label>🎙️ AI VOICE GENERATOR</label>
            <select id="voice-toggle">
                <option value="ON">Auto Audio: ON</option>
                <option value="OFF">Auto Audio: OFF</option>
            </select>
        </div>
    </div>

    <!-- Notice Input -->
    <div class="input-group">
        <label>📝 संदेश / स्कूल अपडेट</label>
        <textarea id="message" placeholder="यहाँ संदेश लिखें... AI खुद सजाकर प्रो-फॉर्मेट बना देगा।"></textarea>
    </div>

    <!-- Media Link Input -->
    <div class="input-group">
        <label>🔗 मीडिया / YouTube / App लिंक</label>
        <input type="url" id="link" placeholder="https://youtube.com/... या कोई भी URL">
    </div>

    <!-- Buttons -->
    <button class="btn btn-ai" onclick="optimizeAI()">⚡ 1-Click MrBeast AI Optimization</button>
    <button class="btn btn-rocket" onclick="fireRocketBroadcast()">🚀 FIRE ROCKET BROADCAST NOW</button>
    <button class="btn btn-red-alert" onclick="triggerRedAlert()">🚨 1-TAP RED ALERT EMERGENCY</button>

    <!-- Terminal -->
    <div class="terminal-box" id="logs">
        > STARK ENGINE ONLINE.<br>> Waiting for owner command...
    </div>
</div>

<script>
    function unlockSystem() {
        const pin = document.getElementById('passcode').value;
        if(pin === "9999" || pin === "") {
            document.getElementById('security-lock').style.display = 'none';
        } else {
            alert("गलत पासवर्ड! केवल ओनर सूरज इसे खोल सकते हैं।");
        }
    }

    function updateTarget() {
        const target = document.getElementById('target-select').value;
        document.getElementById('target-count').innerText = target;
    }

    function log(msg) {
        const logs = document.getElementById('logs');
        logs.innerHTML += `<br>> ${msg}`;
        logs.scrollTop = logs.scrollHeight;
    }

    function optimizeAI() {
        let msg = document.getElementById('message').value;
        if(!msg) {
            log("ERROR: पहले कुछ संदेश लिखें!");
            return;
        }
        document.getElementById('message').value = "🚨 [OFFICIAL NOTICE | SURAJ HQ] 🚨\n\n" + msg + "\n\n👇 नीचे दिए गए आधिकारिक लिंक पर तुरंत क्लिक करें:";
        log("MrBeast Hook Applied. Standardized Formatting Done!");
    }

    function fireRocketBroadcast() {
        log("Parallel Rocket Dispatcher Triggered...");
        log("Executing 500 parallel threads...");
        setTimeout(() => {
            document.getElementById('delivered-count').innerText = "1,450";
            log("✅ SUCCESS: Dispatched to 1,450 members in 0.4 seconds!");
        }, 400);
    }

    function triggerRedAlert() {
        document.getElementById('message').value = "🚨 EMERGENCY NOTICE: भारी बारिश के कारण आज स्कूल पूर्णतः बंद रहेगा। घर पर सुरक्षित रहें!";
        log("RED ALERT MODE ACTIVATED!");
        fireRocketBroadcast();
    }
</script>

</body>
  </html>
