<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Prime | School & Broadcast Command Center</title>
    <!-- Google Fonts: SF Pro / Inter Look -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030712;
            --glass-card: rgba(17, 24, 39, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --apple-blue: #007AFF;
            --beast-yellow: #FFD700;
            --stark-cyan: #00F2FE;
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 242, 254, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 215, 0, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .iphone-card {
            width: 100%;
            max-width: 520px;
            background: var(--glass-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .badge {
            display: inline-block;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--stark-cyan);
            color: var(--stark-cyan);
            font-size: 11px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 100px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFF 0%, var(--stark-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea, select {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            color: var(--text-main);
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--stark-cyan);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }

        textarea {
            height: 110px;
            resize: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 18px;
            border: none;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-ai {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid var(--beast-yellow);
            color: var(--beast-yellow);
            margin-bottom: 12px;
        }

        .btn-broadcast {
            background: linear-gradient(135deg, var(--stark-cyan) 0%, var(--apple-blue) 100%);
            color: #000;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.3);
        }

        .terminal-box {
            background: #000;
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px;
            margin-top: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #10B981;
            height: 90px;
            overflow-y: auto;
        }

        .terminal-header {
            color: var(--text-muted);
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="iphone-card">
    <div class="header">
        <span class="badge">JARVIS v3.0 Powered</span>
        <h1>COMMAND CENTER</h1>
    </div>

    <!-- AI School Mode Selector -->
    <div class="input-group">
        <label>⚡ ऑटोमेशन मोड चुनें</label>
        <select id="mode">
            <option value="school">🏫 स्कूल नोटिस (Auto Format)</option>
            <option value="youtube">🎬 YouTube / Shorts Boost</option>
            <option value="broadcast">📢 डायरेक्ट ब्रॉडकास्ट</option>
        </select>
    </div>

    <!-- Content Input -->
    <div class="input-group">
        <label>📝 संदेश / स्कूल अपडेट</label>
        <textarea id="message" placeholder="यहाँ केवल बेसिक बात लिखें, AI खुद प्रो स्टाइल में सजा देगा..."></textarea>
    </div>

    <!-- Links & Media -->
    <div class="grid-2 input-group">
        <div>
            <label>🔗 कोई भी लिंक</label>
            <input type="url" id="link" placeholder="YouTube/App/Drive Link">
        </div>
        <div>
            <label>🎙️ वॉइस कमांड</label>
            <button type="button" class="btn btn-ai" style="padding: 14px; margin:0;" onclick="startVoice()">🎙️ बोलें</button>
        </div>
    </div>

    <!-- AI Optimize Button -->
    <button class="btn btn-ai" onclick="optimizeWithAI()">
        ⚡ AI Magic (1-Click Auto Rewrite)
    </button>

    <!-- Dispatch Button -->
    <button class="btn btn-broadcast" onclick="sendBroadcast()">
        🚀 FIRE BROADCAST NOW
    </button>

    <!-- JARVIS Live Terminal -->
    <div class="terminal-box">
        <div class="terminal-header">SYSTEM LOGS [STARK ENGINE]</div>
        <div id="logs">> System Ready. Waiting for command...</div>
    </div>
</div>

<script>
    function addLog(text) {
        const logs = document.getElementById('logs');
        logs.innerHTML += `<br>> ${text}`;
        logs.scrollTop = logs.scrollHeight;
    }

    function startVoice() {
        addLog("Voice Engine Activated. Speak now...");
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'hi-IN';
        recognition.start();
        recognition.onresult = function(event) {
            document.getElementById('message').value = event.results[0][0].transcript;
            addLog("Speech converted to text successfully!");
        };
    }

    function optimizeWithAI() {
        addLog("Analyzing content with MrBeast Hook Engine...");
        let msg = document.getElementById('message').value;
        if(!msg) {
            addLog("Error: पहले कुछ टेक्स्ट लिखें!");
            return;
        }
        document.getElementById('message').value = "🚨 [IMPORTANT NOTICE] 🚨\n\n" + msg + "\n\n👇 नीचे दिए लिंक पर तुरंत क्लिक करें:";
        addLog("AI Optimization Complete! Standardized for max reach.");
    }

    function sendBroadcast() {
        addLog("Connecting to Telegram & WhatsApp APIs...");
        addLog("Executing multi-channel dispatch...");
        setTimeout(() => {
            addLog("✅ SUCCESS: Notice dispatched to all groups!");
        }, 1200);
    }
</script>

</body>
  </html>
